<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Job Cards</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ✅ DEFINED ONLY ONCE — NO DUPLICATE
    const SUPABASE_URL = 'https://dkdnlgwflrwdxtrovrrq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRrZG5sZ3dmbHJ3ZHh0cm92cnJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MjM4NjUsImV4cCI6MjA5NTk5OTg2NX0.vf3uAq8uInMBMEw6fU-qng2kg_BjunGNgFhGoA_V4Gk';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
    body {background:#f5f5f5; padding:2rem;}
    .box {max-width:450px; margin:3rem auto; background:white; padding:2rem; border-radius:8px; box-shadow:0 2px 10px #0000001a; text-align:center;}
    .tabs {display:flex; margin-bottom:1.5rem; background:#eee; border-radius:6px; padding:4px;}
    .tab {flex:1; padding:0.7rem; border:none; background:none; border-radius:4px; cursor:pointer; font-weight:500;}
    .tab.active {background:white; color:#000;}
    input {width:100%; padding:0.8rem; margin:0.5rem 0; border:1px solid #ddd; border-radius:4px; font-size:1rem;}
    button {width:100%; padding:0.8rem; background:#2563eb; color:white; border:none; border-radius:4px; font-size:1rem; cursor:pointer; margin-top:0.5rem;}
    button:hover {background:#1d4ed8;}
    .hidden {display:none !important;}
    .msg {padding:0.7rem; margin:0.7rem 0; border-radius:4px; font-size:0.9rem; text-align:left;}
    .error {background:#fee2e2; color:#dc2626;}
    .success {background:#dcfce7; color:#166534;}
    .link {background:#dbeafe; color:#1e40af;}
  </style>
</head>
<body>

<!-- LOGIN / CREATE ACCOUNT — ALWAYS VISIBLE FIRST -->
<div id="authBox" class="box">
  <h2>Workshop Job Cards</h2>
  <p style="margin:1rem 0 1.5rem;">Sign in or create an account</p>

  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="showLogin()">Sign In</button>
    <button class="tab" id="tabSignup" onclick="showSignup()">Create Account</button>
  </div>

  <div id="errorMsg" class="msg error hidden"></div>
  <div id="successMsg" class="msg success hidden"></div>
  <div id="linkMsg" class="msg link hidden"></div>

  <!-- LOGIN FORM -->
  <div id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email address">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="doLogin()">Sign In</button>
  </div>

  <!-- SIGNUP FORM -->
  <div id="signupForm" class="hidden">
    <input type="text" id="firstName" placeholder="First name">
    <input type="text" id="lastName" placeholder="Last name">
    <input type="email" id="signupEmail" placeholder="Email address">
    <input type="password" id="signupPass" placeholder="Password (min 6 chars)">
    <input type="password" id="signupPass2" placeholder="Confirm password">
    <button onclick="doSignup()">Create Account</button>
  </div>
</div>

<!-- MAIN APP — ONLY SHOWS AFTER LOGIN -->
<div id="appBox" class="box hidden">
  <h2>✅ Logged in</h2>
  <p>Job cards will work here — login/signup is fixed now.</p>
  <button onclick="signOut()">Sign Out</button>
</div>

<script>
function showLogin() {
  document.getElementById('tabLogin').classList.add('active');
  document.getElementById('tabSignup').classList.remove('active');
  document.getElementById('loginForm').classList.remove('hidden');
  document.getElementById('signupForm').classList.add('hidden');
  clearMsgs();
}

function showSignup() {
  document.getElementById('tabLogin').classList.remove('active');
  document.getElementById('tabSignup').classList.add('active');
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('signupForm').classList.remove('hidden');
  clearMsgs();
}

function showError(m) {
  document.getElementById('errorMsg').textContent = m;
  document.getElementById('errorMsg').classList.remove('hidden');
  document.getElementById('successMsg').classList.add('hidden');
  document.getElementById('linkMsg').classList.add('hidden');
}
function showSuccess(m) {
  document.getElementById('successMsg').textContent = m;
  document.getElementById('successMsg').classList.remove('hidden');
  document.getElementById('errorMsg').classList.add('hidden');
  document.getElementById('linkMsg').classList.add('hidden');
}
function showLink(m) {
  document.getElementById('linkMsg').innerHTML = m;
  document.getElementById('linkMsg').classList.remove('hidden');
  document.getElementById('errorMsg').classList.add('hidden');
  document.getElementById('successMsg').classList.add('hidden');
}
function clearMsgs() {
  document.getElementById('errorMsg').classList.add('hidden');
  document.getElementById('successMsg').classList.add('hidden');
  document.getElementById('linkMsg').classList.add('hidden');
}

// LOGIN
async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) return showError('Enter email and password');

  const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
  if (error) return showError('Login failed: ' + error.message);

  checkUser();
}

// SIGNUP
async function doSignup() {
  const first = document.getElementById('firstName').value.trim();
  const last = document.getElementById('lastName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const pass = document.getElementById('signupPass').value;
  const pass2 = document.getElementById('signupPass2').value;

  if (!first || !last) return showError('Enter first & last name');
  if (!email.includes('@')) return showError('Enter valid email');
  if (pass.length < 6) return showError('Password min 6 characters');
  if (pass !== pass2) return showError('Passwords do not match');

  const { data, error } = await supabase.auth.signUp({
    email, password: pass,
    options: {
      data: { first_name: first, last_name: last },
      emailRedirectTo: 'https://build-tracker.co.uk'
    }
  });

  if (error) return showError('Signup failed: ' + error.message);

  showSuccess('✅ Account created!');
  if (data?.user?.identities?.[0]?.identity_data?.email_confirm_url) {
    showLink(`No email? <a href="${data.user.identities[0].identity_data.email_confirm_url}" target="_blank" style="color:#1e40af; font-weight:bold;">CLICK HERE TO ACTIVATE</a>`);
  }
}

// SIGN OUT
async function signOut() {
  await supabase.auth.signOut();
  checkUser();
}

// CHECK IF LOGGED IN
async function checkUser() {
  const { data: { user } } = await supabase.auth.getUser();
  if (user) {
    document.getElementById('authBox').classList.add('hidden');
    document.getElementById('appBox').classList.remove('hidden');
  } else {
    document.getElementById('authBox').classList.remove('hidden');
    document.getElementById('appBox').classList.add('hidden');
  }
}

// INIT
supabase.auth.onAuthStateChange(() => checkUser());
checkUser();
</script>
</body>
</html>
