<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed version for Android adaptive icons and the iPhone home
       screen: the phone crops it to its own shape (circle, squircle...), so
       the car stays inside the middle 60% and the orange runs to the edges. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb8a3c"/>
      <stop offset="1" stop-color="#ea6c0a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(112 112) scale(12)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 17h-.5A1.5 1.5 0 0 1 3 15.5V12l2.2-5.1A2 2 0 0 1 7 5.7h10a2 2 0 0 1 1.8 1.2L21 12v3.5a1.5 1.5 0 0 1-1.5 1.5H19"/>
    <path d="M3 12h18"/>
    <circle cx="7" cy="17" r="2"/>
    <circle cx="17" cy="17" r="2"/>
  </g>
</svg>
